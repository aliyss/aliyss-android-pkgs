[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aliyss-android-pkgs"
version = "0.1.0"
description = "Tooling for the aliyss-android-pkgs Nix repository of Android APK packages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[tool.setuptools]
# The scripts under scripts/ are standalone CLI tools (not a package): they
# are run as `python scripts/update.py` etc., so nothing is shipped here.
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `scripts/` importable so tests can `import update` etc. without the
# sys.path hack that used to live in tests/conftest.py.
pythonpath = ["scripts"]
addopts = "-ra"
# Structural tests walk the real repo; fail fast if a seeder wrote bad JSON.
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts", "tests"]

[tool.ruff.lint]
# Modern default set: pyflakes + pycodestyle errors (E4/E7/E9), import
# sorting (I), pyupgrade (UP) and bugbear (B).
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # Docstring-first scripts intentionally repeat the script name.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests compare exact strings / build ad-hoc fixtures; imports need not be sorted.
"tests/*.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
# Strict typing for the tooling: every function is annotated, generics are
# required on builtins, and Any is only allowed where JSON/third-party data
# is genuinely untyped (explicitly cast/ignored at those boundaries).
strict = true
python_version = "3.11"
# Same import path pytest uses (pythonpath = ["scripts"]) so the test files
# can `import update` / `import categories` etc.
mypy_path = "scripts"
files = ["scripts/", "tests/"]
exclude = ["tests/data/"]

[[tool.mypy.overrides]]
# bs4's stubs are thin; the DOM is inherently dynamic. Annotate the handful
# of helpers in update.py that touch it, ignore the rest of the soup access.
module = "bs4"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The tests reach into argparse Namespace/CLI plumbing; keep them strict too
# but relax just the JSON fixtures.
module = "httpx"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Test functions conventionally skip return annotations (pytest collects
# them by name, not by type); everything else stays strict. Listed by exact
# module name (mypy matches the top-level test module names directly).
module = [
    "test_categories",
    "test_recategorize",
    "test_repo_structure",
    "test_seed_apkpure",
    "test_seed_fdroid",
    "test_seed_verified_apps",
    "test_update",
]
disallow_untyped_defs = false
check_untyped_defs = true
