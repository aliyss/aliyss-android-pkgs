name: CI

on:
  push:
  pull_request:

jobs:
  # The two device-facing scripts run as root on a phone, so they are linted
  # even though the Python tooling has its own strict gate. No nix required:
  # shellcheck and bash ship on the runner, mirroring the flake's `shell` check.
  shell:
    name: shellcheck + bash -n (device-facing scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck (warning and above)
        run: |
          shellcheck --version
          shellcheck --severity=warning -s bash scripts/*.sh tests/*.sh tests/fake/*

      - name: parse check
        run: |
          for f in scripts/*.sh tests/*.sh tests/fake/*; do
            bash -n "$f"
          done

  python-tests:
    name: ruff + mypy + pytest (scripts + repo structure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check scripts/ tests/
      - name: Format check
        run: ruff format --check scripts/ tests/
      - name: Type check
        run: mypy scripts/ tests/
      - name: Run tests
        run: pytest -q tests/

  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Check flake
        run: nix flake check
