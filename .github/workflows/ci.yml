name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    name: ruff + mypy + pytest (scripts + repo structure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check scripts/ tests/
      - name: Format check
        run: ruff format --check scripts/ tests/
      - name: Type check
        run: mypy scripts/ tests/
      - name: Run tests
        run: pytest -q tests/

  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Check flake
        run: nix flake check
